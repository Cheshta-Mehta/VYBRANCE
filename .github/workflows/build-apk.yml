name: Build Android APK
on:
  workflow_dispatch: {}
  push:
    paths: ["android-app/**", "hackfinal.html", ".github/workflows/build-apk.yml"]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build debug APK
        working-directory: android-app
        run: |
          npm install
          node scripts/prepare-www.js
          npx cap add android
          python3 scripts/patch-android.py
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SunoSuraksha-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
